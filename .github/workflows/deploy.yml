
name: Deploy

on:
  push:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, production]

    defaults:
      run:
        working-directory: /home/e5/5ee5dev

    steps:
      - name: Check working copy is safe to deploy from
        run: |
          branch=$(git rev-parse --abbrev-ref HEAD)

          if [ "$branch" != "main" ]; then
            echo "Working copy is on '$branch', not main." >&2
            exit 1
          fi

          if [ -n "$(git status --porcelain)" ]; then
            echo "Working copy has uncommitted changes." >&2
            git status --short >&2
            exit 1
          fi

      - name: Pull from GitHub
        run: git pull --ff-only origin main

      - name: Verify pnpm
        run: |
          command -v pnpm
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build and restart
        shell: bash
        run: |
          while IFS='=' read -r name _; do
            case "$name" in
              GITHUB_*|FORGEJO_*|GITEA_*|ACTIONS_*|RUNNER_*)
                unset "$name"
                ;;
            esac
          done < <(env)

          pnpm run deploy

